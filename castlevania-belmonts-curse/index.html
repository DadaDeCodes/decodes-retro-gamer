<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ข้อมูล Castlevania Belmont's Curse</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: radial-gradient(ellipse at center, #101736 0%, #070a1c 55%, #03040c 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: "Segoe UI", Tahoma, sans-serif;
    padding: 24px;
  }
  a.logo-link {
    display: block;
    max-width: 640px;
    width: 90%;
    transition: transform .35s ease, filter .35s ease;
    filter: drop-shadow(0 0 18px rgba(120, 140, 255, .25));
  }
  a.logo-link:hover, a.logo-link:focus {
    transform: scale(1.03);
    filter: drop-shadow(0 0 34px rgba(200, 40, 50, .55));
    outline: none;
  }
  a.logo-link img { width: 100%; height: auto; display: block; }
  .hint {
    margin-top: 28px;
    color: #8b96c9;
    font-size: 15px;
    letter-spacing: .06em;
    animation: pulse 2.4s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100% { opacity: .45; } 50% { opacity: 1; } }
</style>
</head>
<body>
  <a class="logo-link" href="belmont.html" title="เข้าสู่ข้อมูล Castlevania Belmont's Curse">
    <img src="logo.png" alt="Castlevania Belmont's Curse">
  </a>
  <div class="hint">คลิกโลโก้เพื่อเข้าสู่ข้อมูลเกม</div>
</body>
</html>
