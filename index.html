<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Decodes Retro Gamer</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: radial-gradient(ellipse at center, #101736 0%, #070a1c 55%, #03040c 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: "Segoe UI", Tahoma, sans-serif;
    padding: 24px;
    color: #dfe6ff;
  }
  h1 {
    font-size: clamp(26px, 5vw, 42px);
    letter-spacing: .12em;
    font-weight: 600;
    color: #eef1ff;
    text-shadow: 0 0 22px rgba(120, 140, 255, .45);
    margin-bottom: 10px;
    text-align: center;
  }
  .sub { color: #8b96c9; font-size: 15px; letter-spacing: .05em; margin-bottom: 44px; text-align: center; }
  a.game-link {
    display: block;
    max-width: 520px;
    width: 88%;
    transition: transform .35s ease, filter .35s ease;
    filter: drop-shadow(0 0 16px rgba(120, 140, 255, .22));
  }
  a.game-link:hover, a.game-link:focus {
    transform: scale(1.03);
    filter: drop-shadow(0 0 32px rgba(200, 40, 50, .55));
    outline: none;
  }
  a.game-link img { width: 100%; height: auto; display: block; }
  .game-name { margin-top: 16px; text-align: center; color: #aeb9e8; font-size: 16px; letter-spacing: .04em; }
</style>
</head>
<body>
  <h1>DECODES RETRO GAMER</h1>
  <div class="sub">คลังข้อมูลเกมเรโทร — เลือกเกมที่ต้องการดูข้อมูล</div>
  <a class="game-link" href="castlevania-belmonts-curse/" title="ข้อมูล Castlevania Belmont's Curse">
    <img src="castlevania-belmonts-curse/logo.png" alt="Castlevania Belmont's Curse">
  </a>
  <div class="game-name">Castlevania: Belmont's Curse</div>
</body>
</html>
